name: Build PulsePlay APK

# Build a debug APK on every push and PR, and whenever triggered by hand.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest ships the Android SDK; licenses are pre-accepted.
      # chmod keeps the build working even if gradlew arrived via web upload
      # (which drops the Unix executable bit).
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulsePlay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
