name: Build PulsePlay APK

# Build a debug APK on every push and PR, and whenever triggered by hand.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source (with the chiaki-ng engine submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          # The chiaki-ng submodule ships its own Gradle wrapper jar, which this
          # action's validator doesn't recognize. We only build with our own wrapper.
          validate-wrappers: false

      # chiaki-ng's native build generates protobuf sources via nanopb, which needs
      # the protobuf compiler (protoc) and the Python protobuf module.
      - name: Install protobuf toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          python3 -m pip install --user --break-system-packages protobuf

      # Cross-compile the Orbit Link node (Rust) for Android. Away-from-home play
      # tunnels to the PS5 through this node; it ships as a native lib the app execs.
      - name: Set up Rust for Android
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked || cargo install cargo-ndk

      - name: Build Orbit Link node (all ABIs)
        working-directory: engine/orbit-link
        run: |
          # The NDK path lives in the shell process env (ANDROID_NDK_ROOT), not in
          # GitHub's ${{ env }} context, so resolve it here with fallbacks.
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(ls -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | sort -V | tail -1)"
          fi
          echo "Using Android NDK at: $NDK"
          test -d "$NDK" || { echo "::error::No Android NDK found on the runner"; exit 1; }
          export ANDROID_NDK_HOME="$NDK"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 build --release -p link-node
          # Copy the node binary into each ABI's jniLibs dir (named lib*.so so it's
          # extracted and executable). ABI -> Rust target triple:
          declare -A TRIPLE=( [arm64-v8a]=aarch64-linux-android [armeabi-v7a]=armv7-linux-androideabi [x86_64]=x86_64-linux-android )
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/$abi"
            cp "target/${TRIPLE[$abi]}/release/orbit-link-node" \
               "$GITHUB_WORKSPACE/app/src/main/jniLibs/$abi/liborbitlinknode.so"
          done

      # ubuntu-latest ships the Android SDK; licenses are pre-accepted.
      # chmod keeps the build working even if gradlew arrived via web upload
      # (which drops the Unix executable bit).
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulsePlay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
