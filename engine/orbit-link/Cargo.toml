[workspace]
resolver = "2"
members = ["crates/link-proto", "crates/link-core", "crates/link-node"]

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/saawant12/orbit-link"

[workspace.dependencies]
link-proto = { path = "crates/link-proto" }
link-core = { path = "crates/link-core" }
boringtun = { version = "0.7.1", default-features = false }
base64 = "0.22"
getrandom = "0.2"
libc = "0.2"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
boringtun = { path = "vendor/boringtun-0.7.1" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
debug = false
