[package]
name = "link-core"
description = "Orbit Link device engine: direct encrypted connections, userspace network stack and port forwarding"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
link-proto.workspace = true
boringtun.workspace = true
base64.workspace = true
getrandom.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
smoltcp = { version = "0.14", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv4-fragmentation",
    "socket-tcp",
    "socket-tcp-pause-synack",
    "socket-udp",
    "auto-icmp-echo-reply",
    "fragmentation-buffer-size-16384",
    "reassembly-buffer-size-16384",
    "reassembly-buffer-count-4",
    "assembler-max-segment-count-16",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO"] }
